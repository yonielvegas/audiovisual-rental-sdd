x-postgres-env: &postgres-env
  PGHOST: db
  PGPORT: 5432
  PGDATABASE: ${PGDATABASE:-audiovisual}
  PGUSER: ${PGUSER:-audiovisual}
  PGPASSWORD: ${PGPASSWORD:?Copy .env.example to .env and set PGPASSWORD}

x-admin-env: &admin-env
  <<: *postgres-env
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Copy .env.example to .env and set ADMIN_PASSWORD}

x-app-env: &app-env
  <<: *postgres-env
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}

x-app-image: &app-image
  image: audiovisual-rental-sdd-local
  build: .
  pull_policy: never

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${PGDATABASE:-audiovisual}
      POSTGRES_USER: ${PGUSER:-audiovisual}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Copy .env.example to .env and set PGPASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 15
  migrate:
    <<: *app-image
    # Aplica las migraciones y deja lista la cuenta administrativa. La
    # contraseña llega por entorno y nunca se escribe en el repositorio.
    command: ["sh", "-c", "node src/backend/migrate.js && node src/backend/bootstrap-admin.js"]
    environment: *admin-env
    depends_on:
      db:
        condition: service_healthy
  app:
    <<: *app-image
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(response => { if (!response.ok) process.exitCode = 1; }).catch(() => { process.exitCode = 1; });"]
      interval: 5s
      timeout: 4s
      retries: 10

volumes:
  postgres-data:
