<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080e1a">
    <title>{{title}}</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <header class="site-header shell">
      <div class="site-bar glass">
        <a class="brand" href="/">
          <span class="brand-mark" aria-hidden="true"></span>
          Alquiler audiovisual
        </a>
        <nav class="site-nav" aria-label="Navegación principal">
          <a href="/"{{home-current}}>Inicio</a>
          <a href="/#nosotros">Nosotros</a>
          <a href="/catalogo"{{catalog-current}}>Catálogo</a>
          <a href="/disponibilidad"{{availability-current}}>Disponibilidad</a>
          <a id="nav-reservations" href="/reservas"{{reservations-current}} hidden>Mis reservas</a>
          <a id="nav-inventory" href="/inventario"{{inventory-current}} hidden>Inventario</a>
        </nav>
        <div class="site-session" id="site-session" data-state="unknown">
          <a class="button button-secondary button-compact" id="session-access" href="/acceso"{{access-current}} hidden>Acceder</a>
          <span class="session-user" id="session-user" hidden></span>
          <button class="button button-secondary button-compact" id="session-logout" type="button" hidden>Cerrar sesión</button>
        </div>
      </div>
    </header>
    <main id="contenido" tabindex="-1">
      {{content}}
    </main>
    <footer class="site-footer shell">
      <small>Proyecto académico de Tópicos Especiales II</small>
      <p id="system-status" class="status" role="status">Comprobando la conexión con el servidor.</p>
      <noscript><small>Activa JavaScript para consultar el estado de la conexión.</small></noscript>
    </footer>
  </body>
</html>
