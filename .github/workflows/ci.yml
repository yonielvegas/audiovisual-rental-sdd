name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Pruebas técnicas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Ejecutar las pruebas automatizadas
        run: |
          npm ci
          npm test
      - name: Arrancar PostgreSQL y la aplicación
        run: |
          cp .env.example .env
          docker compose up --build --wait --wait-timeout 90
      - name: Comprobar inicio, recursos, acceso, catálogo e inventario
        run: |
          set -a
          . ./.env
          set +a
          npm run test:smoke
      - name: Comprobar las migraciones y su segunda ejecución
        run: |
          psql_query() {
            docker compose exec -T db psql -XAt -v ON_ERROR_STOP=1 -U audiovisual -d audiovisual -c "$1"
          }
          applied="SELECT COUNT(*) FROM public.schema_migrations WHERE version IN ('001-baseline.sql', '002-inventory.sql', '003-accounts.sql', '004-catalog-details.sql', '005-catalog-seed.sql')"
          test "$(psql_query "$applied")" = 5
          docker compose run --rm migrate
          test "$(psql_query "$applied")" = 5
          test "$(psql_query "SELECT to_regnamespace('audiovisual') IS NOT NULL")" = t
      - name: Comprobar la unicidad del inventario en PostgreSQL
        run: |
          psql_query() {
            docker compose exec -T db psql -XAt -v ON_ERROR_STOP=1 -U audiovisual -d audiovisual -c "$1"
          }
          test "$(psql_query "SELECT indisunique FROM pg_index WHERE indexrelid = 'audiovisual.units_inventory_code_unique'::regclass")" = t
          duplicated="SELECT COUNT(*) FROM (SELECT inventory_code FROM audiovisual.units GROUP BY inventory_code HAVING COUNT(*) > 1) AS repetidos"
          test "$(psql_query "$duplicated")" = 0
          test "$(psql_query "SELECT COUNT(*) >= 2 FROM audiovisual.units")" = t
      - name: Comprobar el catálogo sembrado por la migración
        run: |
          psql_query() {
            docker compose exec -T db psql -XAt -v ON_ERROR_STOP=1 -U audiovisual -d audiovisual -c "$1"
          }
          # Al menos diez equipos publicados con marca, modelo, descripción,
          # tarifa, imagen del mismo origen y una unidad apta para alquiler.
          completos="SELECT COUNT(*) FROM audiovisual.equipment e WHERE e.published AND e.brand <> '' AND e.model <> '' AND e.description <> '' AND e.daily_rate_cents IS NOT NULL AND e.image_url LIKE '/img/%' AND EXISTS (SELECT 1 FROM audiovisual.units u WHERE u.equipment_id = e.id AND u.active)"
          test "$(psql_query "$completos")" -ge 10
          # La semilla se puede volver a aplicar sin duplicar registros.
          docker compose exec -T db psql -XAt -v ON_ERROR_STOP=1 -U audiovisual -d audiovisual -f - < db/migrations/005-catalog-seed.sql
          test "$(psql_query "$completos")" -ge 10
          test "$(psql_query "SELECT COUNT(*) = COUNT(DISTINCT inventory_code) FROM audiovisual.units")" = t
      - name: Comprobar la cuenta administrativa y el almacenamiento de contraseñas
        run: |
          psql_query() {
            docker compose exec -T db psql -XAt -v ON_ERROR_STOP=1 -U audiovisual -d audiovisual -c "$1"
          }
          set -a
          . ./.env
          set +a
          # La cuenta existe con el rol ADMIN y una sola vez.
          test "$(psql_query "SELECT COUNT(*) FROM audiovisual.users WHERE username = '${ADMIN_USERNAME}' AND role = 'ADMIN'")" = 1
          # La contraseña se guarda como hash Argon2id, nunca en texto plano.
          test "$(psql_query "SELECT password_hash LIKE '\$argon2id\$%' FROM audiovisual.users WHERE username = '${ADMIN_USERNAME}'")" = t
          test "$(psql_query "SELECT COUNT(*) FROM audiovisual.users WHERE password_hash = '${ADMIN_PASSWORD}'")" = 0
          # El registro público de la prueba de humo nunca concede el rol ADMIN.
          test "$(psql_query "SELECT COUNT(*) FROM audiovisual.users WHERE username LIKE 'humo%' AND role <> 'USER'")" = 0
          # Cerrar sesión borra la fila, así que la revocación es efectiva.
          test "$(psql_query "SELECT COUNT(*) FROM audiovisual.sessions s JOIN audiovisual.users u ON u.id = s.user_id WHERE u.role = 'ADMIN'")" = 0
      - name: Comprobar la respuesta con PostgreSQL detenido
        run: |
          docker compose stop db
          npm run test:smoke -- --database-down
      - name: Mostrar los registros de Compose
        if: ${{ failure() && hashFiles('.env') != '' }}
        run: docker compose logs --no-color
      - name: Apagar la composición de prueba
        if: ${{ always() && hashFiles('.env') != '' }}
        run: docker compose down --volumes --remove-orphans
